# =============================================================================
# 大啥杯 DA SHA CUP · nginx 站点配置样例（纯静态单页，无需构建/后端）
# -----------------------------------------------------------------------------
# 用法（Ubuntu / Debian，root 权限）：
#   1) sudo mkdir -p /var/www/dashabei
#   2) 把本文件存到 /etc/nginx/conf.d/dashabei.conf（或 sites-available/dashabei + ln -s）
#   3) 改下面两处：server_name 改成你的域名，root 改成实际目录
#   4) sudo nginx -t && sudo systemctl reload nginx
#   5) 想上 HTTPS：sudo apt install certbot python3-certbot-nginx
#      sudo certbot --nginx -d 你的域名        # 会自动改写本文件并加上 443
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name dashabei.example.com;      # ← 改成你的域名；没有域名可写服务器 IP 或 _

    root  /var/www/dashabei;               # ← 站点目录（与 tools/deploy.ps1 -Target 保持一致）
    index index.html;

    charset utf-8;
    access_log /var/log/nginx/dashabei.access.log;
    error_log  /var/log/nginx/dashabei.error.log;

    # 静态文件直读，找不到就 404（本站不是 SPA，没有前端路由回退需求）
    location / {
        try_files $uri $uri/ =404;
    }

    # 图片：长缓存（文件名固定，改了数据记得改文件名或用 ?v= 查询串）
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 数据文件：不缓存，改完刷新即见
    location = /data/site-data.json {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # index.html 不缓存，保证站点更新后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/xml;

    # 基础安全响应头（本站无后端、无表单、无 Cookie，这几个就够）
    add_header X-Content-Type-Options    nosniff          always;
    add_header X-Frame-Options           SAMEORIGIN       always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
}
